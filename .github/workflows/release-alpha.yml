name: Release alpha desktop build

# Manual, owner-dispatched alpha release. Builds the pinned Gemini payload into unsigned (ad-hoc
# signed) macOS .dmg bundles for Apple Silicon and Intel and an unsigned Windows NSIS installer,
# then publishes them as a GitHub prerelease tagged desktop-v<version>. No Developer ID,
# Authenticode, notarization or updater feed: testers clear Gatekeeper or SmartScreen by hand, as
# the release notes say. Each build is also signed with the updater key, and publishing moves the
# desktop-updater release's latest.json to this version, which installed apps check on launch.
# A dispatch from a branch other than main builds everything and publishes nothing, so the
# workflow can be rehearsed before it lands.

run-name: apodictic-tauri-release-alpha version=${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Alpha version, e.g. 0.1.0-alpha.1"
        required: true

permissions:
  contents: write

concurrency:
  group: apodictic-tauri-release-alpha
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require an alpha prerelease version and an unused tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'; then
            echo "::error::version must look like 0.1.0-alpha.1"
            exit 1
          fi
          if gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release desktop-v$VERSION already exists"
            exit 1
          fi

  macos:
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sync pinned desktop payload
        run: node scripts/sync-gemini-web.mjs --pinned
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Require downloaded bytes to match committed lock
        run: git diff --exit-code -- gemini-web.lock
      - name: Verify vendored sidecar runtime contract
        run: node scripts/verify-sidecar-runtime.mjs
      - name: Build ad-hoc signed dmg bundles and signed update archives
        env:
          VERSION: ${{ inputs.version }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            npx tauri build --target "$target" --bundles app,dmg --config "{\"version\":\"$VERSION\"}"
            arch="${target%%-*}"
            bundle="src-tauri/target/$target/release/bundle"
            cp "$(ls "$bundle"/dmg/*.dmg)" "release-assets/APODICTIC-$VERSION-macos-$arch.dmg"
            cp "$bundle/macos/APODICTIC.app.tar.gz" "release-assets/APODICTIC-$VERSION-macos-$arch.app.tar.gz"
            cp "$bundle/macos/APODICTIC.app.tar.gz.sig" "release-assets/APODICTIC-$VERSION-macos-$arch.app.tar.gz.sig"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: release-assets/*
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sync pinned desktop payload
        run: node scripts/sync-gemini-web.mjs --pinned
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Require downloaded bytes to match committed lock
        run: git diff --exit-code -- gemini-web.lock
      - name: Verify vendored sidecar runtime contract
        run: node scripts/verify-sidecar-runtime.mjs
      - name: Build unsigned NSIS installer and its update signature
        env:
          VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis --config "{\"version\":\"$VERSION\"}"
          src=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          cp "$src" "release-assets/APODICTIC-$VERSION-windows-x86_64-setup.exe"
          cp "$src.sig" "release-assets/APODICTIC-$VERSION-windows-x86_64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish prerelease
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum *.dmg *.exe *.app.tar.gz > SHA256SUMS.txt)
          node scripts/write-update-manifest.mjs --version "$VERSION" --assets release-assets \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-v$VERSION" \
            --out latest.json
          engine=$(node -p "JSON.parse(require('fs').readFileSync('gemini-web.lock', 'utf8')).tag")
          cat > release-notes.md <<EOF
          Alpha build of the APODICTIC desktop app (engine ${engine}) for macOS and Windows.

          - Apple Silicon Mac: APODICTIC-${VERSION}-macos-aarch64.dmg
          - Intel Mac: APODICTIC-${VERSION}-macos-x86_64.dmg
          - Windows 10 or 11 (64-bit): APODICTIC-${VERSION}-windows-x86_64-setup.exe

          These builds are not notarized or code-signed.

          On a Mac, drag APODICTIC to Applications, then open it once with right-click > Open, or run:

              xattr -dr com.apple.quarantine /Applications/APODICTIC.app

          On Windows, SmartScreen may warn that the installer is unrecognized. Choose
          More info > Run anyway.

          Add your own provider key or connect a supported local provider. Manuscripts stay on
          your machine except for requests sent to the provider you choose.
          EOF
          gh release create "desktop-v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "APODICTIC desktop $VERSION" --notes-file release-notes.md
          # Installed apps poll this fixed release for latest.json, so publishing moves them forward.
          if ! gh release view desktop-updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updater --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "APODICTIC desktop update feed" \
              --notes "Update feed for installed APODICTIC desktop apps. Download installers from the desktop-v releases."
          fi
          gh release upload desktop-updater latest.json --repo "$GITHUB_REPOSITORY" --clobber
