name: Sync Gemini desktop payload

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Gemini release ref to sync (tag, or 'latest' for newest release)"
        required: false
        default: "latest"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor the selected Gemini desktop payload
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
          REF: ${{ github.event.inputs.ref || 'latest' }}
        run: |
          if [ "$REF" = "latest" ]; then
            node scripts/sync-gemini-web.mjs
          else
            node scripts/sync-gemini-web.mjs "$REF"
          fi
      - name: Read pinned release
        id: lock
        run: |
          echo "tag=$(node -p "require('./gemini-web.lock').tag")" >> "$GITHUB_OUTPUT"
          echo "web=$(node -p "require('./gemini-web.lock').web_version")" >> "$GITHUB_OUTPUT"
      - name: Ensure sync PR is draft and unarmed before update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-sync-pr-draft.mjs --repository "$GITHUB_REPOSITORY"
      - name: Open or update draft bump PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/sync-gemini-web
          commit-message: "Sync Gemini desktop payload to ${{ steps.lock.outputs.tag }} (web ${{ steps.lock.outputs.web }})"
          title: "Sync Gemini desktop payload to ${{ steps.lock.outputs.tag }}"
          body: |
            Automated sync to the latest released APODICTIC-Gemini desktop payload.

            - **Release:** ${{ steps.lock.outputs.tag }}
            - **Web version:** ${{ steps.lock.outputs.web }}
            - Updated `gemini-web.lock`; vendored payload bytes remain gitignored and are re-pulled by CI.
          delete-branch: true
          draft: always-true
          add-paths: gemini-web.lock
      - name: Ensure sync PR is draft and unarmed after update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ensure-sync-pr-draft.mjs --repository "$GITHUB_REPOSITORY"
