name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Rust shell (build + clippy)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Compile against the published bytes pinned by gemini-web.lock, not stubs or a moving latest
      # release. The separate drift-gate job owns freshness enforcement.
      - name: Sync pinned desktop payload
        working-directory: ${{ github.workspace }} # override the job's src-tauri default — paths are repo-root-relative
        run: node scripts/sync-gemini-web.mjs --pinned
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Require downloaded bytes to match committed lock
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- gemini-web.lock
      # The pinned sync already downloaded and hash-verified the payload. Run
      # freshness against those same bytes here instead of renting a second
      # Linux runner to repeat the checkout and network work.
      - name: Vendor drift gate
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-gemini-web.mjs --check
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
      - name: Verify vendored sidecar runtime contract
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-sidecar-runtime.mjs

  # NOTE: the Rust job now executes the real pinned macOS sidecar contract. A full `tauri build`
  # installer smoke remains future work. Windows build/smoke is gated behind a Windows runner —
  # v1 is macOS-only (docs/architecture.md §5/§9-E).
