name: ci

# Public repository, so Actions minutes are free. Drafts start nothing; a
# non-draft PR (usually a train/ branch) runs the job.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: apodictic-tauri-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Vault capability test
        run: node --test tests/policy/capabilities.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Sync pinned desktop payload
        run: node scripts/sync-gemini-web.mjs --pinned
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Require downloaded bytes to match committed lock
        run: git diff --exit-code -- gemini-web.lock
      - name: Vendor drift gate
        run: node scripts/sync-gemini-web.mjs --check
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Packaging probe behavior and tamper tests
        run: npm run test:packaging-probe
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust build
        working-directory: src-tauri
        run: cargo build --locked
      - name: Verify vendored sidecar runtime contract
        run: node scripts/verify-sidecar-runtime.mjs
