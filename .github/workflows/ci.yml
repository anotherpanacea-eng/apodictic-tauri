name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust shell (build + clippy)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Compile against the published bytes, not stubs: the runtime mode contract lives in the
      # sidecar executable and source-only Rust checks cannot prove that the pinned payload honors it.
      - name: Sync latest desktop payload
        working-directory: ${{ github.workspace }} # override the job's src-tauri default — paths are repo-root-relative
        run: node scripts/sync-gemini-web.mjs
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}
      - name: Require committed lock to match synced release
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- gemini-web.lock
      - name: Verify vendored sidecar runtime contract
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-sidecar-runtime.mjs
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build

  drift-gate:
    name: Vendor drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pass the cross-repo token so the gate does REAL verification once the lock is pinned: a clean
      # CI checkout has no vendored payload (gitignored), so --check verifies the committed lock against
      # the PUBLISHED release manifest (hashes/sidecars/commit) + freshness — it does NOT silently pass
      # (Codex P1 re-review, 2026-06-19). While the lock is `bootstrap` it's a no-op (nothing published).
      - run: node scripts/sync-gemini-web.mjs --check
        env:
          GEMINI_SYNC_TOKEN: ${{ secrets.GEMINI_SYNC_TOKEN }}

  # NOTE: the Rust job now executes the real pinned macOS sidecar contract. A full `tauri build`
  # installer smoke remains future work. Windows build/smoke is gated behind a Windows runner —
  # v1 is macOS-only (docs/architecture.md §5/§9-E).
